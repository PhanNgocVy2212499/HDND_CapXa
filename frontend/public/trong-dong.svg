<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Màu vàng đồng Đông Sơn chuẩn -->
    <style>
      .td-stroke { stroke: #c89528; stroke-linecap: round; stroke-linejoin: round; }
      .td-fill { fill: #c89528; }
    </style>
  </defs>
  
  <g fill="none" class="td-stroke" transform="translate(300, 300)">
    <!-- 1. Mặt trời trung tâm 14 tia sáng -->
    <circle r="26" class="td-fill" fill-opacity="0.18" stroke="#c89528" stroke-width="2.5" />
    <path d="
      M0 -40 L5 -22 L14 -35 L12 -19 L26 -27 L18 -12 L35 -14 L22 -4 L40 0 
      L22 4 L35 14 L18 12 L26 27 L12 19 L14 35 L5 22 L0 40 
      L-5 22 L-14 35 L-12 19 L-26 27 L-18 12 L-35 14 L-22 4 L-40 0 
      L-22 -4 L-35 -14 L-18 -12 L-26 -27 L-12 -19 L-14 -35 L-5 -22 Z
    " class="td-fill" fill-opacity="0.45" stroke="#c89528" stroke-width="2" />
    
    <!-- 2. Vành tròn đồng tâm thứ nhất -->
    <circle r="52" stroke-width="2" />
    <circle r="57" stroke-width="1.5" stroke-dasharray="2 3" />
    <circle r="63" stroke-width="2" />
    
    <!-- 3. Vành răng lược / tam giác lông công -->
    <circle r="80" stroke-width="1.8" />
    <g class="td-fill" fill-opacity="0.35">
      <!-- 16 tam giác răng cưa -->
      <path d="M0 -80 L6 -68 L-6 -68 Z" />
      <path d="M31 -74 L37 -61 L26 -65 Z" />
      <path d="M57 -57 L61 -43 L51 -50 Z" />
      <path d="M74 -31 L75 -17 L67 -25 Z" />
      <path d="M80 0 L77 14 L71 2 Z" />
      <path d="M74 31 L68 44 L64 30 Z" />
      <path d="M57 57 L48 68 L47 54 Z" />
      <path d="M31 74 L19 82 L22 68 Z" />
      <path d="M0 80 L-6 68 L6 68 Z" />
      <path d="M-31 74 L-37 61 L-26 65 Z" />
      <path d="M-57 57 L-61 43 L-51 50 Z" />
      <path d="M-74 31 L-75 17 L-67 25 Z" />
      <path d="M-80 0 L-77 -14 L-71 -2 Z" />
      <path d="M-74 -31 L-68 -44 L-64 -30 Z" />
      <path d="M-57 -57 L-48 -68 L-47 -54 Z" />
      <path d="M-31 -74 L-19 -82 L-22 -68 Z" />
    </g>
    <circle r="86" stroke-width="2" />
    
    <!-- 4. Vành chấm vòng tròn đồng tâm kép -->
    <circle r="102" stroke-width="1.8" />
    <circle r="108" stroke-width="1.5" stroke-dasharray="2 4" />
    <circle r="116" stroke-width="2" />
    
    <!-- 5. Vành chim Lạc bay (6 chim Lạc cách điệu) -->
    <circle r="142" stroke-width="2.2" />
    <g class="td-fill" fill-opacity="0.5" stroke="#c89528" stroke-width="1.8">
      <!-- Chim Lạc 1 (0 deg) -->
      <g transform="rotate(0)">
        <path d="M-10 -138 C40 -150, 95 -136, 128 -145 C108 -140, 80 -132, 60 -134 C45 -122, 15 -130, -10 -138 Z" />
        <circle cx="118" cy="-141" r="2.5" fill="#c89528" />
      </g>
      <!-- Chim Lạc 2 (60 deg) -->
      <g transform="rotate(60)">
        <path d="M-10 -138 C40 -150, 95 -136, 128 -145 C108 -140, 80 -132, 60 -134 C45 -122, 15 -130, -10 -138 Z" />
        <circle cx="118" cy="-141" r="2.5" fill="#c89528" />
      </g>
      <!-- Chim Lạc 3 (120 deg) -->
      <g transform="rotate(120)">
        <path d="M-10 -138 C40 -150, 95 -136, 128 -145 C108 -140, 80 -132, 60 -134 C45 -122, 15 -130, -10 -138 Z" />
        <circle cx="118" cy="-141" r="2.5" fill="#c89528" />
      </g>
      <!-- Chim Lạc 4 (180 deg) -->
      <g transform="rotate(180)">
        <path d="M-10 -138 C40 -150, 95 -136, 128 -145 C108 -140, 80 -132, 60 -134 C45 -122, 15 -130, -10 -138 Z" />
        <circle cx="118" cy="-141" r="2.5" fill="#c89528" />
      </g>
      <!-- Chim Lạc 5 (240 deg) -->
      <g transform="rotate(240)">
        <path d="M-10 -138 C40 -150, 95 -136, 128 -145 C108 -140, 80 -132, 60 -134 C45 -122, 15 -130, -10 -138 Z" />
        <circle cx="118" cy="-141" r="2.5" fill="#c89528" />
      </g>
      <!-- Chim Lạc 6 (300 deg) -->
      <g transform="rotate(300)">
        <path d="M-10 -138 C40 -150, 95 -136, 128 -145 C108 -140, 80 -132, 60 -134 C45 -122, 15 -130, -10 -138 Z" />
        <circle cx="118" cy="-141" r="2.5" fill="#c89528" />
      </g>
    </g>
    <circle r="152" stroke-width="2.2" />

    <!-- 6. Vành hoa văn hình học chữ S gãy / sóng nước -->
    <circle r="174" stroke-width="1.8" />
    <circle r="182" stroke-width="1.5" stroke-dasharray="3 4" />
    <circle r="194" stroke-width="2" />
    
    <!-- 7. Vành răng cưa lớn ngoài -->
    <circle r="218" stroke-width="2" />
    <circle r="226" stroke-width="1.8" stroke-dasharray="2 3" />
    <circle r="236" stroke-width="2.5" />
    
    <!-- 8. Vành ngoài cùng biên giới hạn -->
    <circle r="255" stroke-width="2" stroke-dasharray="4 4" />
    <circle r="270" stroke-width="3" />
    <circle r="285" stroke-width="1.5" />
  </g>
</svg>
